        ],
        "properties": {
          "projectVersionId": {
            "type": "string",
            "format": "uuid"
          },
          "capability": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "audience": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "models": {
            "type": "array",
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 200
            },
            "maxItems": 20
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "CredentialGrant": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
