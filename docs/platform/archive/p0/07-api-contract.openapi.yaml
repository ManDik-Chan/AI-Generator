          "state"
        ],
        "properties": {
          "artifactId": {
            "type": "string",
            "format": "uuid"
          },
          "state": {
            "type": "string",
            "enum": [
              "UPLOADED",
              "SCANNING",
              "APPROVED",
              "REJECTED"
            ]
          }
        }
      },
      "CredentialRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "providerRef",
          "label",
