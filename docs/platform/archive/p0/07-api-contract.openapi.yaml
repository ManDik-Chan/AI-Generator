            },
            "maxProperties": 10
          }
        }
      },
      "UploadComplete": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "artifactId"
        ],
        "properties": {
          "artifactId": {
            "type": "string",
            "format": "uuid"
          },
          "parts": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "partNumber",
                "etag"
              ],
              "properties": {
                "partNumber": {
                  "type": "integer",
                  "minimum": 1,
                  "maximum": 10000
                },
                "etag": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 200
                }
              }
            },
            "maxItems": 10000
          }
        }
      },
      "UploadStatus": {
        "type": "object",
        "additionalProperties": false,
        "required": [
