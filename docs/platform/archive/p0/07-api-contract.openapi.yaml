          },
          "label": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "secret": {
            "type": "string",
            "minLength": 1,
            "maxLength": 8192,
            "writeOnly": true
          },
          "mode": {
            "type": "string",
            "enum": [
              "PERSISTENT",
              "SESSION"
            ]
          }
        }
      },
      "Credential": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "providerRef",
          "label",
          "fingerprint",
          "status",
          "mode"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "providerRef": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "label": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "fingerprint": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "status": {
            "type": "string",
            "enum": [
              "ACTIVE",
              "REVOKED",
              "EXPIRED"
            ]
          },
          "mode": {
            "type": "string",
            "enum": [
              "PERSISTENT",
              "SESSION"
            ]
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "CredentialGrantRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "projectVersionId",
          "capability",
          "audience",
          "models",
