          "projectVersionId",
          "status",
          "expiresAt"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "credentialId": {
            "type": "string",
            "format": "uuid"
          },
          "projectVersionId": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "type": "string",
            "enum": [
              "ACTIVE",
              "REVOKED",
              "EXPIRED"
            ]
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Callback": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "eventId",
          "runId",
          "attempt",
          "fence",
          "sequence",
          "state"
        ],
        "properties": {
          "eventId": {
            "type": "string",
            "format": "uuid"
          },
          "runId": {
            "type": "string",
            "format": "uuid"
          },
          "attempt": {
            "type": "integer",
            "minimum": 1
          },
          "fence": {
            "type": "integer",
            "minimum": 1
          },
          "sequence": {
            "type": "integer",
            "minimum": 1
          },
          "state": {
            "type": "string",
            "enum": [
              "ACCEPTED",
              "RUNNING",
              "SUCCEEDED",
              "FAILED",
              "CANCELLED"
            ]
          },
          "outputArtifactIds": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            },
            "maxItems": 32
          }
        }
      },
      "Manifest": {
        "title": "AIG Project Manifest — PROPOSED, NOT IMPLEMENTED",
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schemaVersion",
          "projectId",
          "slug",
          "version",
          "name",
          "category",
          "visibility",
          "integration",
          "capabilities",
          "dataPolicy"
        ],
        "properties": {
          "schemaVersion": {
            "const": "1.0.0"
          },
          "projectId": {
            "type": "string",
            "format": "uuid"
          },
          "slug": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,62}$"
          },
          "version": {
            "type": "string",
            "pattern": "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$",
            "maxLength": 80
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "summary": {
            "type": "string",
            "maxLength": 500
          },
          "category": {
            "enum": [
              "research",
              "web-service",
              "algorithm",
              "software",
              "ai",
              "other"
            ]
          },
          "visibility": {
            "enum": [
              "PRIVATE",
              "UNLISTED",
              "PUBLIC"
            ]
          },
          "integration": {
            "oneOf": [
              {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "mode"
                ],
                "properties": {
                  "mode": {
                    "const": "SHOWCASE"
                  }
                }
              },
              {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "mode",
                  "embedRef"
                ],
                "properties": {
                  "mode": {
                    "const": "VERIFIED_EMBED"
                  },
                  "embedRef": {
                    "$ref": "#/components/schemas/Manifest/$defs/registryRef"
                  }
                }
              },
              {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "mode",
                  "openapi",
                  "endpointRef",
                  "operations"
                ],
                "properties": {
                  "mode": {
                    "const": "REMOTE_API"
                  },
                  "openapi": {
                    "type": "string",
                    "pattern": "^\\./[A-Za-z0-9_-]+\\.(yaml|json)$",
                    "maxLength": 100
                  },
                  "endpointRef": {
                    "$ref": "#/components/schemas/Manifest/$defs/registryRef"
                  },
                  "operations": {
                    "type": "array",
                    "minItems": 1,
                    "maxItems": 32,
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": [
                        "capability",
                        "operationId",
                        "inputSchema",
                        "outputSchema"
                      ],
                      "properties": {
                        "capability": {
                          "type": "string",
                          "maxLength": 100
                        },
                        "operationId": {
                          "type": "string",
                          "pattern": "^[A-Za-z][A-Za-z0-9_]{0,99}$"
                        },
                        "inputSchema": {
                          "$ref": "#/components/schemas/Manifest/$defs/schemaPath"
                        },
                        "outputSchema": {
                          "$ref": "#/components/schemas/Manifest/$defs/schemaPath"
                        }
                      }
                    }
                  }
                }
              }
            ]
          },
          "capabilities": {
            "type": "array",
            "minItems": 1,
            "maxItems": 32,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "pattern": "^[a-z][a-z0-9]*(\\.[a-z][a-z0-9-]*){1,5}$",
              "maxLength": 100
            }
          },
          "dataPolicy": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "publicDemoData",
              "requiresExplicitConsentForRemoteProcessing",
              "dataClasses",
              "retentionSeconds"
            ],
            "properties": {
              "publicDemoData": {
                "enum": [
                  "none",
                  "curated-synthetic-only",
                  "approved-public-assets"
                ]
              },
              "requiresExplicitConsentForRemoteProcessing": {
                "type": "boolean"
              },
              "processorRef": {
                "$ref": "#/components/schemas/Manifest/$defs/registryRef"
              },
              "dataClasses": {
                "type": "array",
                "minItems": 1,
                "uniqueItems": true,
                "items": {
                  "enum": [
                    "SYNTHETIC",
                    "PUBLIC_CURATED",
                    "PERSONAL",
                    "MEDICAL_SENSITIVE"
                  ]
                }
              },
              "retentionSeconds": {
                "type": "integer",
                "minimum": 0,
                "maximum": 2592000
              }
            }
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "integration": {
                  "properties": {
                    "mode": {
                      "const": "REMOTE_API"
                    }
                  }
                }
              }
            },
            "then": {
              "properties": {
                "dataPolicy": {
                  "required": [
                    "processorRef"
                  ],
                  "properties": {
                    "requiresExplicitConsentForRemoteProcessing": {
                      "const": true
                    }
                  }
                }
              }
            }
          }
        ],
        "$defs": {
          "registryRef": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,79}$"
          },
          "schemaPath": {
            "type": "string",
            "pattern": "^\\./[A-Za-z0-9_-]+\\.schema\\.json$",
            "maxLength": 120
          }
        }
      },
      "Presentation": {
        "title": "AIG Presentation — PROPOSED, NOT IMPLEMENTED",
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schemaVersion",
          "projectId",
          "version",
          "title",
          "sections"
        ],
        "properties": {
          "schemaVersion": {
            "const": "1.0.0"
          },
          "projectId": {
            "type": "string",
            "format": "uuid"
          },
          "version": {
            "type": "string",
            "pattern": "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$",
            "maxLength": 80
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "sections": {
            "type": "array",
            "maxItems": 24,
            "items": {
              "oneOf": [
                {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "id",
                    "kind",
                    "title",
                    "body",
                    "verification"
                  ],
                  "properties": {
                    "id": {
                      "$ref": "#/components/schemas/Presentation/$defs/id"
                    },
                    "kind": {
                      "const": "MARKDOWN"
                    },
                    "title": {
                      "$ref": "#/components/schemas/Presentation/$defs/title"
                    },
                    "body": {
                      "type": "string",
                      "maxLength": 20000
                    },
                    "verification": {
                      "$ref": "#/components/schemas/Presentation/$defs/verification"
                    },
                    "sourceAssetIds": {
                      "$ref": "#/components/schemas/Presentation/$defs/assets"
                    }
                  }
                },
                {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "id",
                    "kind",
                    "title",
                    "metrics"
                  ],
                  "properties": {
                    "id": {
                      "$ref": "#/components/schemas/Presentation/$defs/id"
                    },
                    "kind": {
                      "const": "BENCHMARKS"
                    },
                    "title": {
                      "$ref": "#/components/schemas/Presentation/$defs/title"
                    },
                    "metrics": {
                      "type": "array",
                      "maxItems": 30,
                      "items": {
                        "$ref": "#/components/schemas/Presentation/$defs/metric"
                      }
                    }
                  }
                },
                {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "id",
                    "kind",
                    "title",
                    "viewerType",
                    "assetIds",
                    "dataClass"
                  ],
                  "properties": {
                    "id": {
                      "$ref": "#/components/schemas/Presentation/$defs/id"
                    },
                    "kind": {
                      "const": "VIEWER"
                    },
                    "title": {
                      "$ref": "#/components/schemas/Presentation/$defs/title"
                    },
                    "viewerType": {
                      "enum": [
                        "MESH3D",
                        "IMAGE_STACK",
                        "PLOT"
                      ]
                    },
                    "assetIds": {
                      "$ref": "#/components/schemas/Presentation/$defs/assets",
                      "minItems": 1
                    },
                    "dataClass": {
                      "enum": [
                        "SYNTHETIC",
                        "PUBLIC_CURATED"
                      ]
                    }
                  }
                },
                {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "id",
                    "kind",
                    "title",
                    "assetIds"
                  ],
                  "properties": {
                    "id": {
                      "$ref": "#/components/schemas/Presentation/$defs/id"
                    },
                    "kind": {
                      "const": "DOCS"
                    },
                    "title": {
                      "$ref": "#/components/schemas/Presentation/$defs/title"
                    },
                    "assetIds": {
                      "$ref": "#/components/schemas/Presentation/$defs/assets",
                      "minItems": 1
                    }
                  }
                }
              ]
            }
          }
        },
        "$defs": {
          "id": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{0,63}$"
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "verification": {
            "enum": [
              "VERIFIED_SOURCE",
              "VERIFIED_TEST",
              "CLAIMED",
              "UNVERIFIED"
            ]
          },
          "assets": {
            "type": "array",
            "maxItems": 30,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "format": "uuid"
            }
          },
          "metric": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "name",
              "status"
            ],
            "properties": {
              "name": {
                "$ref": "#/components/schemas/Presentation/$defs/title"
              },
              "status": {
                "enum": [
                  "UNPUBLISHED",
                  "REPORTED",
                  "REPRODUCED"
                ]
              },
              "value": {
                "type": "number"
              },
              "unit": {
                "type": "string",
                "maxLength": 40
              },
              "dataset": {
                "type": "string",
                "maxLength": 200
              },
              "protocol": {
                "type": "string",
                "maxLength": 2000
              },
              "evidenceAssetId": {
                "type": "string",
                "format": "uuid"
              }
            },
            "allOf": [
              {
                "if": {
                  "properties": {
                    "status": {
                      "const": "UNPUBLISHED"
                    }
                  }
                },
                "then": {
                  "not": {
                    "anyOf": [
                      {
                        "required": [
                          "value"
                        ]
                      },
                      {
                        "required": [
                          "unit"
                        ]
                      },
                      {
                        "required": [
                          "dataset"
                        ]
                      },
                      {
                        "required": [
                          "protocol"
                        ]
                      },
                      {
                        "required": [
                          "evidenceAssetId"
                        ]
                      }
                    ]
                  }
                },
                "else": {
                  "required": [
                    "value",
                    "unit",
                    "dataset",
                    "protocol",
                    "evidenceAssetId"
                  ]
                }
              }
            ]
          }
        }
      }
    },
    "responses": {
      "Error": {
        "description": "Sanitized error; never return raw provider messages, keys, stack traces or connection strings.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      }
    }
  }
}
