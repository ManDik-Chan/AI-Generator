name: Merge Gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Authenticated browser acceptance (chromium-desktop, chromium-mobile, webkit-iphone) runs once per
# commit in Security Acceptance, behind the real Supabase acceptance jobs; see docs/ci-pipeline.md.
jobs:
  registry-jcs-reference:
    name: Registry JCS Python reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact PR commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify JCS bytes and hashes against the pinned Python reference
        shell: bash
        run: |
          set -euo pipefail
          reference="$RUNNER_TEMP/registry-jcs-reference"
          mkdir "$reference"
          git -C "$reference" init --quiet
          git -C "$reference" remote add origin https://github.com/cyberphone/json-canonicalization.git
          git -C "$reference" fetch --depth=1 origin 32a48195b9b20fe67b1795e39e4509f14d860b45
          git -C "$reference" -c core.hooksPath=/dev/null checkout --detach --quiet FETCH_HEAD
          python3 --version
          python3 scripts/verify-registry-jcs.py --reference-root "$reference"

  quality:
    name: ${{ matrix.gate.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gate:
          - name: lint
            command: pnpm lint
          - name: typecheck
            command: pnpm typecheck
          - name: unit tests
            command: pnpm test
          - name: build
            command: pnpm build
    steps:
      - name: Check out the exact PR commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.7.0
          run_install: false
      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.gate.name }}
        run: ${{ matrix.gate.command }}

  node24-compatibility:
    name: Node 24 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact PR commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.7.0
          run_install: false
      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Node 24 compatibility gates
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
