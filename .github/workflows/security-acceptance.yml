name: Security Acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supabase-security-acceptance:
    name: Supabase Security Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REQUIRE_SECURITY_TEST_DATABASE: "true"
    steps:
      - name: Check out the exact PR commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.7.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@6ffe784b57613e98e0c04651e5fde0cec28cb1c9
        with:
          version: 2.109.1

      - name: Start isolated local Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase start >"$RUNNER_TEMP/supabase-start.log" 2>&1
          status_env="$(supabase status -o env)"
          eval "$status_env"
          for value in "$ANON_KEY" "$SERVICE_ROLE_KEY" "$DB_URL"; do
            echo "::add-mask::$value"
          done
          {
            printf 'DATABASE_URL=%s\n' "$DB_URL"
            printf 'DIRECT_URL=%s\n' "$DB_URL"
            printf 'TEST_DATABASE_URL=%s\n' "$DB_URL"
            printf 'ALLOW_TEST_DATABASE_MUTATIONS=true\n'
            printf 'TEST_DATABASE_CONFIRMED_NON_PRODUCTION=true\n'
            printf 'SUPABASE_TEST_URL=%s\n' "$API_URL"
            printf 'SUPABASE_TEST_ANON_KEY=%s\n' "$ANON_KEY"
            printf 'SUPABASE_TEST_SERVICE_ROLE_KEY=%s\n' "$SERVICE_ROLE_KEY"
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$API_URL"
            printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SERVICE_ROLE_KEY"
            printf 'NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000\n'
            printf 'PLAYWRIGHT_AUTH_STATE=%s/playwright-auth.json\n' "$RUNNER_TEMP"
            printf 'AI_BASE_URL=http://127.0.0.1:4319/v1\n'
            printf 'AI_API_KEY=isolated-test-provider-key\n'
            printf 'AI_MODEL=isolated-test-model\n'
            printf 'AI_MEMORY_MODEL=isolated-memory-model\n'
            printf 'AI_EMBEDDING_MODEL=mock-embedding\n'
            printf 'AI_EMBEDDING_DIMENSIONS=512\n'
          } >> "$GITHUB_ENV"

      - name: Apply all migrations to a clean database
        run: pnpm exec prisma migrate deploy

      - name: Verify clean migration metadata
        run: node scripts/verify-security-migrations.mjs clean

      - name: Run real authenticated JWT and PostgREST attacks
        run: pnpm test:rls

      - name: Run real quota and Proposal production-transaction tests
        run: |
          pnpm exec vitest run \
            tests/integration/usage-ledger.integration.test.ts \
            tests/integration/memory-proposals.integration.test.ts

      - name: Verify old-database upgrade and transaction rollback
        run: node scripts/verify-security-migrations.mjs incremental

      - name: Run static quality gates
        run: |
          pnpm lint
          pnpm typecheck
          pnpm exec vitest run --exclude "tests/integration/**"
          pnpm exec prisma validate

      - name: Stop isolated Supabase
        if: always()
        shell: bash
        run: supabase stop --no-backup >"$RUNNER_TEMP/supabase-stop.log" 2>&1 || true

  authenticated-browser-acceptance:
    name: Authenticated E2E (${{ matrix.project }})
    needs: supabase-security-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-desktop
            browser: chromium
          - project: chromium-mobile
            browser: chromium
          - project: webkit-iphone
            browser: webkit
    steps:
      - name: Check out the exact PR commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.7.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@6ffe784b57613e98e0c04651e5fde0cec28cb1c9
        with:
          version: 2.109.1

      - name: Start project-isolated local Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase start >"$RUNNER_TEMP/supabase-${{ matrix.project }}.log" 2>&1
          status_env="$(supabase status -o env)"
          eval "$status_env"
          for value in "$ANON_KEY" "$SERVICE_ROLE_KEY" "$DB_URL"; do
            echo "::add-mask::$value"
          done
          {
            printf 'DATABASE_URL=%s\n' "$DB_URL"
            printf 'DIRECT_URL=%s\n' "$DB_URL"
            printf 'TEST_DATABASE_URL=%s\n' "$DB_URL"
            printf 'ALLOW_TEST_DATABASE_MUTATIONS=true\n'
            printf 'TEST_DATABASE_CONFIRMED_NON_PRODUCTION=true\n'
            printf 'SUPABASE_TEST_URL=%s\n' "$API_URL"
            printf 'SUPABASE_TEST_ANON_KEY=%s\n' "$ANON_KEY"
            printf 'SUPABASE_TEST_SERVICE_ROLE_KEY=%s\n' "$SERVICE_ROLE_KEY"
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$API_URL"
            printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SERVICE_ROLE_KEY"
            printf 'NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000\n'
            printf 'PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000\n'
            printf 'PLAYWRIGHT_AUTH_STATE=%s/playwright-auth-${{ matrix.project }}.json\n' "$RUNNER_TEMP"
            printf 'PLAYWRIGHT_OUTPUT_DIR=test-results/${{ matrix.project }}\n'
            printf 'PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/${{ matrix.project }}\n'
            printf 'E2E_PROJECT=${{ matrix.project }}\n'
            printf 'E2E_SENSITIVE_VALUES_FILE=%s/e2e-sensitive-${{ matrix.project }}.txt\n' "$RUNNER_TEMP"
            printf 'AI_BASE_URL=http://127.0.0.1:4319/v1\n'
            printf 'AI_API_KEY=isolated-test-provider-key\n'
            printf 'AI_MODEL=isolated-test-model\n'
            printf 'AI_MEMORY_MODEL=isolated-memory-model\n'
            printf 'AI_EMBEDDING_MODEL=mock-embedding\n'
            printf 'AI_EMBEDDING_DIMENSIONS=512\n'
          } >> "$GITHUB_ENV"

      - name: Apply all migrations to a clean project database
        run: pnpm exec prisma migrate deploy

      - name: Install project browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Build the application
        run: pnpm build

      - name: Run ready, isolated authenticated project
        shell: bash
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/e2e-raw/${{ matrix.project }}"
          mkdir -p "$log_dir"
          setsid node tests/e2e/mock-ai-provider.mjs >"$log_dir/mock-provider.log" 2>&1 &
          mock_pid=$!
          setsid pnpm start --hostname 127.0.0.1 >"$log_dir/next.log" 2>&1 &
          next_pid=$!
          cleanup() {
            kill -- "-$next_pid" "-$mock_pid" 2>/dev/null || true
            wait "$next_pid" "$mock_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          node scripts/verify-e2e-readiness.mjs
          pnpm exec playwright test \
            --project="${{ matrix.project }}" \
            --workers=1

      - name: Sanitize authenticated E2E diagnostics
        id: sanitize
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/e2e-artifacts/${{ matrix.project }}"
          mkdir -p "$artifact_dir"
          if [[ -e "playwright-report/${{ matrix.project }}" ]]; then
            cp -R "playwright-report/${{ matrix.project }}" "$artifact_dir/playwright-report"
          fi
          if [[ -e "test-results/${{ matrix.project }}" ]]; then
            cp -R "test-results/${{ matrix.project }}" "$artifact_dir/test-results"
          fi
          if [[ -e "$RUNNER_TEMP/e2e-raw/${{ matrix.project }}" ]]; then
            cp -R "$RUNNER_TEMP/e2e-raw/${{ matrix.project }}" "$artifact_dir/service-logs"
          fi
          node scripts/redact-e2e-artifacts.mjs \
            "$artifact_dir" \
            "$E2E_SENSITIVE_VALUES_FILE"
          rm -f "$E2E_SENSITIVE_VALUES_FILE"

      - name: Upload authenticated E2E diagnostics
        if: always() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-authenticated-e2e-${{ matrix.project }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-artifacts/${{ matrix.project }}
          if-no-files-found: warn
          retention-days: 7

      - name: Stop project-isolated Supabase
        if: always()
        shell: bash
        run: supabase stop --no-backup >"$RUNNER_TEMP/supabase-stop-${{ matrix.project }}.log" 2>&1 || true

  authenticated-playwright:
    name: authenticated Playwright
    if: always()
    needs:
      - supabase-security-acceptance
      - authenticated-browser-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify authenticated acceptance results
        shell: bash
        env:
          SUPABASE_RESULT: ${{ needs.supabase-security-acceptance.result }}
          BROWSER_RESULT: ${{ needs.authenticated-browser-acceptance.result }}
        run: |
          set -euo pipefail
          echo "Supabase Security Acceptance: $SUPABASE_RESULT"
          echo "Authenticated browser matrix: $BROWSER_RESULT"

          if [[ "$SUPABASE_RESULT" != "success" ]]; then
            echo "::error::Supabase Security Acceptance did not succeed."
            exit 1
          fi

          if [[ "$BROWSER_RESULT" != "success" ]]; then
            echo "::error::One or more authenticated browser matrix jobs did not succeed."
            exit 1
          fi
